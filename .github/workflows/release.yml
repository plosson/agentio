name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches package.json
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate

    strategy:
      matrix:
        include:
          - target: darwin-x64
            os: macos-15-intel
            artifact: agentio-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            artifact: agentio-darwin-arm64
          - target: linux-x64
            os: ubuntu-latest
            artifact: agentio-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            artifact: agentio-linux-arm64
          - target: windows-x64
            os: windows-latest
            artifact: agentio-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-deb:
    name: Build .deb packages
    runs-on: ubuntu-latest
    needs: [validate, build-binaries]

    strategy:
      matrix:
        include:
          - arch: amd64
            binary: agentio-linux-x64
          - arch: arm64
            binary: agentio-linux-arm64

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}

      - name: Build .deb package
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          ARCH=${{ matrix.arch }}
          PKG_NAME=agentio_${VERSION}_${ARCH}

          mkdir -p ${PKG_NAME}/DEBIAN
          mkdir -p ${PKG_NAME}/usr/bin

          cp ${{ matrix.binary }} ${PKG_NAME}/usr/bin/agentio
          chmod 755 ${PKG_NAME}/usr/bin/agentio

          cat > ${PKG_NAME}/DEBIAN/control << EOF
          Package: agentio
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: plosson <plosson@users.noreply.github.com>
          Description: CLI for LLM agents to interact with communication and tracking services
           A CLI tool designed for LLM agents to interact with communication services
           (Gmail, Telegram, Slack) and tracking systems (JIRA, Linear).
          Homepage: https://github.com/plosson/agentio
          EOF

          dpkg-deb --build ${PKG_NAME}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentio_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.deb
          path: agentio_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.deb

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, publish-npm, build-binaries, build-deb]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [validate, release]

    steps:
      - name: Download checksums
        run: |
          curl -sL "https://github.com/plosson/agentio/releases/download/v${{ needs.validate.outputs.version }}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Extract SHA256 sums
        id: sha
        run: |
          echo "darwin_arm64=$(grep agentio-darwin-arm64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "darwin_x64=$(grep agentio-darwin-x64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(grep agentio-linux-arm64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x64=$(grep agentio-linux-x64 checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: plosson/homebrew-agentio
          token: ${{ secrets.REPOS_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cat > homebrew-tap/Formula/agentio.rb << 'EOF'
          class Agentio < Formula
            desc "CLI for LLM agents to interact with communication and tracking services"
            homepage "https://github.com/plosson/agentio"
            version "${{ needs.validate.outputs.version }}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/plosson/agentio/releases/download/v#{version}/agentio-darwin-arm64"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              else
                url "https://github.com/plosson/agentio/releases/download/v#{version}/agentio-darwin-x64"
                sha256 "${{ steps.sha.outputs.darwin_x64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/plosson/agentio/releases/download/v#{version}/agentio-linux-arm64"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              else
                url "https://github.com/plosson/agentio/releases/download/v#{version}/agentio-linux-x64"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
            end

            def install
              binary_name = stable.url.split("/").last
              bin.install binary_name => "agentio"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/agentio --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentio.rb
          git commit -m "Update agentio to ${{ needs.validate.outputs.version }}"
          git push

  update-scoop:
    name: Update Scoop Manifest
    runs-on: ubuntu-latest
    needs: [validate, release]

    steps:
      - name: Download checksums
        run: |
          curl -sL "https://github.com/plosson/agentio/releases/download/v${{ needs.validate.outputs.version }}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Extract SHA256 sum
        id: sha
        run: |
          echo "windows_x64=$(grep agentio-windows-x64.exe checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: plosson/scoop-agentio
          token: ${{ secrets.REPOS_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        run: |
          cat > scoop-bucket/bucket/agentio.json << EOF
          {
              "version": "${{ needs.validate.outputs.version }}",
              "description": "CLI for LLM agents to interact with communication and tracking services",
              "homepage": "https://github.com/plosson/agentio",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/plosson/agentio/releases/download/v${{ needs.validate.outputs.version }}/agentio-windows-x64.exe",
                      "hash": "${{ steps.sha.outputs.windows_x64 }}"
                  }
              },
              "bin": [["agentio-windows-x64.exe", "agentio"]],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/plosson/agentio/releases/download/v\$version/agentio-windows-x64.exe"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push
        run: |
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/agentio.json
          git commit -m "Update agentio to ${{ needs.validate.outputs.version }}"
          git push
