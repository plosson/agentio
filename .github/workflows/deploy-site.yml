name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/commands/**'
      - 'src/mcp/**'
      - 'scripts/build-site.ts'
      - 'scripts/build-site/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-site.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to agentio.houlahop.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build:site

      - name: Install siteio
        run: |
          curl -LsSf https://siteio.houlahop.com/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login
        run: siteio login --username github-actions
        env:
          SITEIO_TOKEN: ${{ vars.SITEIO_TOKEN }}

      - name: Deploy site
        run: siteio sites deploy site/dist --subdomain agentio
