<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>agentio hub</title>
<style nonce="__CSP_NONCE__">
/*__STYLES__*/
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <a class="logo" href="#profiles">agentio hub</a>
  <nav class="nav" aria-label="Main">
    <a href="#profiles" data-tab="profiles">Profiles</a>
    <a href="#machines" data-tab="machines">Machines</a>
    <a href="#access" data-tab="access">Access</a>
  </nav>
  <span class="r"><span id="hub-host"></span><a href="#settings" class="gear" data-tab="settings" aria-label="Settings" title="Settings">⚙</a></span>
</header>

<main id="main" class="body" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Main" hidden>
  <a href="#profiles" data-tab="profiles">Profiles</a>
  <a href="#machines" data-tab="machines">Machines</a>
  <a href="#access" data-tab="access">Access</a>
</nav>

<dialog id="confirm-dialog" class="box">
  <h2 id="confirm-title"></h2>
  <p id="confirm-body"></p>
  <form method="dialog" class="row end">
    <button value="cancel" class="btn" autofocus>Cancel</button>
    <button value="ok" class="btn red" id="confirm-ok"></button>
  </form>
</dialog>

<dialog id="rename-dialog" class="box">
  <form method="dialog">
    <h2 id="rename-title">Rename</h2>
    <label class="field">New name<input type="text" id="rename-input" required autocomplete="off"></label>
    <div class="row end">
      <button value="cancel" class="btn" formnovalidate>Cancel</button>
      <button value="ok" class="btn pri">Rename</button>
    </div>
  </form>
</dialog>

<dialog id="token-dialog" class="box">
  <h2>Copy the key now</h2>
  <p class="muted">On the machine, after installing agentio, run one of these. The key is not shown again; if it is lost, replace it.</p>
  <p><b>Save it for this user</b></p>
  <div class="codebox"><code id="token-save-cmd"></code><button class="btn" type="button" data-copy-from="token-save-cmd">Copy</button></div>
  <p><b>Or for one shell or a CI job</b></p>
  <div class="codebox"><code id="token-env-cmd"></code><button class="btn" type="button" data-copy-from="token-env-cmd">Copy</button></div>
  <form method="dialog" class="row end"><button class="btn pri" value="ok">Done</button></form>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script nonce="__CSP_NONCE__">

</script>
</body>
</html>
