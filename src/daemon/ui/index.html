<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentio vault</title>
<style>
  :root {
    --bg: #f8f9fa; --surface: #ffffff; --border: #d1d9e0; --border-light: #e8ecf0;
    --text: #1f2328; --text-secondary: #656d76; --text-muted: #8b949e;
    --accent: #0969da; --accent-hover: #0860ca;
    --success: #1a7f37; --success-bg: #dafbe1; --warning: #9a6700; --warning-bg: #fff8c5;
    --error: #cf222e; --error-bg: #ffebe9; --code-bg: #f6f8fa;
    --radius: 8px; --shadow: 0 1px 3px rgba(31,35,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d; --border-light: #21262d;
      --text: #e6edf3; --text-secondary: #8b949e; --text-muted: #6e7681;
      --accent: #58a6ff; --accent-hover: #79c0ff;
      --success: #3fb950; --success-bg: rgba(46,160,67,.15); --warning: #d29922; --warning-bg: rgba(187,128,9,.15);
      --error: #f85149; --error-bg: rgba(248,81,73,.15); --code-bg: #0d1117;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "IBM Plex Sans", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { margin: 0; font-size: 1.125rem; }
  header .meta { color: var(--text-secondary); font-size: .8125rem; }
  main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .card h2 { margin: 0 0 16px; font-size: 1.375rem; line-height: 1.3; }
  label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }
  input[type=password] { width: 100%; padding: 8px 12px; font-size: .875rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .row.right { justify-content: flex-end; }
  button { padding: 8px 14px; font-size: .875rem; font-weight: 600; line-height: 1; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
  .alert { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius); font-size: .875rem; }
  .alert.error { background: var(--error-bg); color: var(--error); }
  .alert.info { background: var(--code-bg); color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 500; font-size: .8125rem; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .badge.ok { background: var(--success-bg); color: var(--success); }
  .badge.invalid { background: var(--error-bg); color: var(--error); }
  .badge.no-creds { background: var(--warning-bg); color: var(--warning); }
  .badge.skipped { background: var(--code-bg); color: var(--text-muted); }
  .tag { font-size: .75rem; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .muted { color: var(--text-secondary); }
  .note { color: var(--text-secondary); font-size: .8125rem; margin: 12px 0 0; }
</style>
</head>
<body>
<header>
  <h1>agentio vault</h1>
  <span class="meta" id="version"></span>
</header>
<main>
  <section class="card" id="view-unlock" hidden>
    <h2>Unlock the vault</h2>
    <form id="unlock-form">
      <label for="passphrase">Passphrase</label>
      <input type="password" id="passphrase" autocomplete="current-password" autofocus required>
      <div class="row right">
        <button class="primary" type="submit" id="unlock-btn">Unlock</button>
      </div>
      <div class="alert error" id="unlock-error" hidden></div>
    </form>
  </section>

  <section class="card" id="view-profiles" hidden>
    <h2>Profiles</h2>
    <div class="alert info" id="profiles-msg" hidden></div>
    <table>
      <thead><tr><th>Service</th><th>Profile</th><th>Status</th><th>Details</th></tr></thead>
      <tbody id="profiles-body"></tbody>
    </table>
    <p class="note">Add or reauthorise profiles with the CLI on this host: <span class="mono">agentio &lt;service&gt; profile add</span>.</p>
    <div class="row right">
      <button id="refresh-btn">Refresh</button>
      <button id="test-btn">Test credentials</button>
      <button id="lock-btn">Lock vault</button>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const views = { unlock: $('view-unlock'), profiles: $('view-profiles') };

  function show(name) {
    for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
    if (name === 'unlock') { $('passphrase').value = ''; $('passphrase').focus(); }
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
    if (res.status === 204) return { ok: true, status: 204, body: null };
    let body = null;
    try { body = await res.json(); } catch { /* no body */ }
    return { ok: res.ok, status: res.status, body };
  }

  function escape(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderProfiles(data) {
    $('version').textContent = data.version ? 'v' + data.version : '';
    const rows = [];
    for (const [service, profiles] of Object.entries(data.services)) {
      for (const p of profiles) {
        const details = p.error || p.info || '';
        rows.push(`<tr>
          <td class="mono">${escape(service)}</td>
          <td>${escape(p.profile)}${p.readOnly ? '<span class="tag">read-only</span>' : ''}</td>
          <td><span class="badge ${escape(p.status)}">${escape(p.status)}</span></td>
          <td class="muted">${escape(details)}</td>
        </tr>`);
      }
    }
    $('profiles-body').innerHTML = rows.join('') || '<tr><td colspan="4" class="muted">No profiles configured.</td></tr>';
  }

  async function loadProfiles(test) {
    const msg = $('profiles-msg');
    msg.hidden = false;
    msg.textContent = test ? 'Testing credentials, this can take a moment…' : 'Loading…';
    $('test-btn').disabled = true;
    $('refresh-btn').disabled = true;
    try {
      const res = await api('/ui/api/status?test=' + (test ? 'true' : 'false'));
      if (res.status === 401 || res.status === 503) { show('unlock'); return; }
      if (!res.ok) { msg.textContent = (res.body && res.body.error) || 'Request failed'; return; }
      renderProfiles(res.body);
      msg.hidden = true;
    } finally {
      $('test-btn').disabled = false;
      $('refresh-btn').disabled = false;
    }
  }

  $('unlock-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = $('unlock-error');
    err.hidden = true;
    $('unlock-btn').disabled = true;
    try {
      const res = await api('/ui/api/unlock', { method: 'POST', body: JSON.stringify({ passphrase: $('passphrase').value }) });
      if (res.ok) { show('profiles'); await loadProfiles(false); return; }
      err.textContent = (res.body && res.body.error) || 'Unlock failed';
      err.hidden = false;
    } finally {
      $('unlock-btn').disabled = false;
    }
  });

  $('refresh-btn').addEventListener('click', () => loadProfiles(false));
  $('test-btn').addEventListener('click', () => loadProfiles(true));
  $('lock-btn').addEventListener('click', async () => {
    await api('/ui/api/lock', { method: 'POST' });
    show('unlock');
  });

  (async () => {
    const res = await api('/ui/api/session');
    if (res.ok && res.body.authenticated && !res.body.locked) { show('profiles'); await loadProfiles(false); }
    else show('unlock');
  })();
})();
</script>
</body>
</html>
