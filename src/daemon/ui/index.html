<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>agentio</title>
<link rel="icon" href="/ui/icon.svg?v=__VERSION__" type="image/svg+xml">
<style nonce="__CSP_NONCE__">
/*__STYLES__*/
</style>
</head>
<body>
<header class="top" id="bar" hidden>
  <a class="lockup" href="#overview"><img src="/ui/icon.svg?v=__VERSION__" alt="" width="36" height="36">agentio</a>
  <nav class="tabs" id="tabs" aria-label="Main">
    <a href="#profiles" data-tab="profiles">Profiles</a>
    <a href="#machines" data-tab="machines">Machines</a>
    <a href="#access" data-tab="access">Access</a>
    <a href="#settings" data-tab="settings">Settings</a>
    <a href="#settings" class="menu-only" data-action="sign-out">Sign out</a>
  </nav>
  <span class="where"><span id="hub-host"></span><button type="button" class="button link sign-out" data-action="sign-out">Sign out</button></span>
  <button type="button" class="button menu-button" id="menu-button" data-action="toggle-menu" aria-expanded="false" aria-controls="tabs" aria-label="Menu">☰</button>
</header>

<main id="main" class="page" tabindex="-1"></main>
<footer class="version" id="version" hidden></footer>

<dialog id="confirm-dialog" class="dialog">
  <h2 id="confirm-title"></h2>
  <p id="confirm-body"></p>
  <form method="dialog" class="actions">
    <button value="cancel" class="button" autofocus>Cancel</button>
    <button value="ok" class="button danger" id="confirm-ok"></button>
  </form>
</dialog>

<dialog id="rename-dialog" class="dialog">
  <form method="dialog">
    <h2 id="rename-title">Rename</h2>
    <label class="form-field"><span class="label">New name</span><input class="input" type="text" id="rename-input" required autocomplete="off"></label>
    <div class="actions">
      <button value="cancel" class="button" formnovalidate>Cancel</button>
      <button value="ok" class="button primary">Rename</button>
    </div>
  </form>
</dialog>

<dialog id="token-dialog" class="dialog">
  <h2>Copy the key now</h2>
  <p class="muted">On the machine, after installing agentio, run one of these. The key is not shown again; if it is lost, replace it.</p>
  <p><b>Save it for this user</b></p>
  <div class="command"><code id="token-save-cmd"></code><button class="button" type="button" data-copy-from="token-save-cmd">Copy</button></div>
  <p><b>Or for one shell or a CI job</b></p>
  <div class="command"><code id="token-env-cmd"></code><button class="button" type="button" data-copy-from="token-env-cmd">Copy</button></div>
  <form method="dialog" class="actions"><button class="button primary" value="ok">Done</button></form>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script nonce="__CSP_NONCE__">
(() => {
'use strict';
const PLUGIN_METADATA = __PLUGIN_METADATA__;
//__SCRIPT__
})();
</script>
</body>
</html>
